services:
  db:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cultiva}
      MYSQL_USER: ${DB_USER:?Define DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    image: cultiva-plus-backend:local
    build:
      context: ./backend
      target: runtime
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_DATABASE:-cultiva}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      STORAGE_LOCAL_PATH: /app/storage_uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backend_uploads:/app/storage_uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(async r => { const d = await r.json(); process.exit(r.ok && d.database === 'ok' ? 0 : 1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: cultiva-plus-migrations:local
    build:
      context: ./backend
      target: migrations
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_DATABASE:-cultiva}
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: ${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  e2e-db:
    image: mysql:8.0.46
    profiles:
      - e2e
    environment:
      MYSQL_DATABASE: rentabilidad_agricola_test
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  backend_uploads:
