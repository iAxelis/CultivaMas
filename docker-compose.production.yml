services:
  backend:
    environment:
      NODE_ENV: production
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "false"
      TRUST_PROXY: "true"
      THROTTLE_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-}

  migrate:
    environment:
      NODE_ENV: production
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "false"

  proxy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN con el dominio publico de la API}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
