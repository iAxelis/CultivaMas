name: cultiva_plus
description: Aplicación Flutter de rentabilidad agrícola Cultiva+.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.6.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.3
  file_saver: ^0.7.0

dev_dependencies:
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/CultivaLogo.png
